<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="softglow3">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="12" fill="url(#bg3)"/>
  <rect x="1" y="1" width="898" height="258" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="65" x2="900" y2="65" stroke="#8b949e"/>
    <line x1="0" y1="130" x2="900" y2="130" stroke="#8b949e"/>
    <line x1="0" y1="195" x2="900" y2="195" stroke="#8b949e"/>
    <line x1="225" y1="0" x2="225" y2="260" stroke="#8b949e"/>
    <line x1="450" y1="0" x2="450" y2="260" stroke="#8b949e"/>
    <line x1="675" y1="0" x2="675" y2="260" stroke="#8b949e"/>
  </g>

  <!-- LEFT: Chain links stacked compact -->
  <g transform="translate(48, 35)" filter="url(#softglow3)">
    <rect x="0" y="22" width="36" height="62" rx="18" fill="none" stroke="url(#glow3)" stroke-width="4"/>
    <rect x="20" y="0" width="36" height="62" rx="18" fill="none" stroke="url(#glow3)" stroke-width="4"/>
    <rect x="40" y="22" width="36" height="62" rx="18" fill="none" stroke="url(#glow3)" stroke-width="4"/>
  </g>

  <!-- /handoff terminal tucked under the chain -->
  <g transform="translate(34, 126)">
    <rect x="0" y="0" width="112" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="20" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#7c3aed">$</text>
    <text x="22" y="20" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#c9d1d9">/handoff</text>
  </g>

  <!-- Title -->
  <text x="190" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">claude-handoff</text>

  <!-- Tagline -->
  <text x="190" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" fill="#8b949e">Never lose context between AI coding sessions.</text>

  <!-- Badges row -->
  <g transform="translate(190, 158)">
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#1f6feb"/>
    <text x="27.5" y="15" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">MIT</text>

    <rect x="63" y="0" width="120" height="22" rx="4" fill="#7c3aed"/>
    <text x="123" y="15" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">Claude Code</text>

    <rect x="191" y="0" width="105" height="22" rx="4" fill="#238636"/>
    <text x="243.5" y="15" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">PRs Welcome</text>
  </g>

  <!-- Version -->
  <text x="865" y="245" font-family="monospace" font-size="12" fill="#484f58" text-anchor="end">v1.4</text>
</svg>